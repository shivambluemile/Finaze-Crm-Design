<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finaze Partner Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#001A56;--accent-600:#0B2A7A;--navy-50:#EEF2FA;--brand:#2A5BD7;--text-strong:#101828;--text-body:#344054;--text-muted:#667085;--text-faint:#98A2B3;--border:#E4E7EC;--page:#F6F7F9;--card:#FFFFFF;--subtle:#F2F4F7;--danger:#D92D20;--danger-bg:rgba(217,45,32,.08);--success:#12A150;--success-bg:rgba(18,161,80,.12);--warn:#8A5A12;--warn-bg:rgba(232,162,60,.16);--info:#2A5BD7;--info-bg:rgba(42,91,215,.1)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:Manrope,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--text-body);background:var(--page);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit}
a{color:var(--brand)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* auth shell */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.brand{position:relative;overflow:hidden;background:var(--accent);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:48px clamp(32px,5vw,72px)}
.brand .logo svg{height:30px;width:auto;display:block}.brand .logo svg path{fill:#fff}
.brand h1{margin:0;font-size:clamp(34px,3.6vw,52px);line-height:1.08;letter-spacing:-.03em;font-weight:800;max-width:520px}
.brand p{margin:16px 0 0;font-size:17px;line-height:1.6;color:rgba(255,255,255,.8);max-width:440px}
.brand ul{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:12px}
.brand li{display:flex;gap:10px;align-items:center;font-size:15px;color:rgba(255,255,255,.88)}
.brand li span{width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;font-size:13px}
.brand .foot{font-size:12px;color:rgba(255,255,255,.55)}
.orb{position:absolute;border-radius:50%;pointer-events:none}
.o1{right:-120px;top:-120px;width:340px;height:340px;background:radial-gradient(circle at 30% 30%,rgba(42,91,215,.55),rgba(42,91,215,0) 70%)}
.o2{right:60px;bottom:-160px;width:300px;height:300px;border:2px solid rgba(255,255,255,.12)}
.panel{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.box{width:100%;max-width:440px}
.box h2{margin:0;font-size:26px;letter-spacing:-.02em;color:var(--text-strong)}
.box .lede{margin:6px 0 24px;font-size:14px;color:var(--text-muted);line-height:1.55}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:var(--text-body)}
.ctl{position:relative;display:flex;align-items:center;height:46px;border:1px solid var(--border);border-radius:11px;background:var(--card);transition:border-color .15s,box-shadow .15s}
.ctl:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,26,86,.12)}
.ctl.err{border-color:var(--danger)}
.ctl input,.ctl select{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;padding:0 14px;font-size:14px;font-weight:500;color:var(--text-strong)}
.ctl select{appearance:none;cursor:pointer}
textarea.ta{width:100%;min-height:84px;padding:12px 14px;border:1px solid var(--border);border-radius:11px;font-size:14px;color:var(--text-strong);outline:none;resize:vertical}
textarea.ta:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,26,86,.12)}
.eye{width:42px;height:42px;border:0;background:none;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;justify-content:center}
.msg{font-size:12px;color:var(--danger)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border:0;border-radius:11px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:background .15s}
.btn:hover{background:var(--accent-600)}.btn[disabled]{opacity:.65;cursor:progress}
.btn.block{width:100%}.btn.ghost{background:var(--card);color:var(--text-strong);border:1px solid var(--border)}.btn.ghost:hover{border-color:var(--accent);color:var(--accent);background:var(--card)}
.btn.sm{height:36px;padding:0 14px;font-size:13px;border-radius:9px}
.link{border:0;background:none;padding:0;color:var(--brand);font-size:13px;font-weight:700;cursor:pointer}
.link:hover{text-decoration:underline}
.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.5;margin-bottom:16px}
.alert b{display:block;color:inherit}
.alert.bad{background:var(--danger-bg);color:#912018}.alert.warn{background:var(--warn-bg);color:var(--warn)}.alert.info{background:var(--navy-50);color:var(--accent)}.alert.good{background:var(--success-bg);color:#0B6B38}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.demo{margin-top:22px;border:1px dashed #C9CDD3;border-radius:12px;padding:12px 14px;background:#FBFCFD}
.demo summary{cursor:pointer;font-size:12px;font-weight:700;color:var(--text-muted);list-style:none}
.demo summary::-webkit-details-marker{display:none}
.demo .acc{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--subtle);font-size:12px}
.demo .acc:first-of-type{border-top:0}
.demo .acc b{color:var(--text-strong)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:11px;font-size:11px;font-weight:700;white-space:nowrap}
/* state screens (verify / setup / workspace / welcome / blocked) */
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:0 1px 2px rgba(16,24,40,.04);padding:32px}
.card.w{width:100%;max-width:560px}
.card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.card .top svg{height:24px;width:auto}
.icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:24px}
.icon.navy{background:var(--navy-50);color:var(--accent)}.icon.red{background:var(--danger-bg);color:var(--danger)}.icon.amber{background:var(--warn-bg);color:var(--warn)}.icon.green{background:var(--success-bg);color:var(--success)}
.card h2{margin:0 0 6px;font-size:22px;letter-spacing:-.02em;color:var(--text-strong)}
.card p{margin:0;font-size:14px;line-height:1.6;color:var(--text-muted)}
.steps{display:flex;gap:6px;margin-bottom:20px}.steps span{flex:1;height:4px;border-radius:2px;background:var(--border)}.steps span.on{background:var(--accent)}
.check{display:grid;gap:8px;margin:18px 0}
.check div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font-size:13px}
.check div b{color:var(--text-strong);font-weight:600}
.otp{display:flex;gap:8px;margin:18px 0 8px}
.otp input{width:48px;height:54px;text-align:center;font-size:22px;font-weight:700;border:1px solid var(--border);border-radius:11px;outline:none;color:var(--text-strong)}
.otp input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,26,86,.12)}
.ws{display:grid;gap:10px;margin:18px 0}
.ws button{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border:1px solid var(--border);border-radius:14px;background:var(--card);cursor:pointer;text-align:left}
.ws button:hover,.ws button.on{border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,26,86,.08)}
.av{flex:none;width:42px;height:42px;border-radius:12px;background:var(--accent);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.feat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:20px 0}
.feat div{padding:14px;border:1px solid var(--border);border-radius:12px;background:#FBFCFD}
.feat b{display:block;margin-top:8px;font-size:13px;color:var(--text-strong)}.feat span{display:block;margin-top:3px;font-size:12px;color:var(--text-muted);line-height:1.45}
.feat i{font-style:normal;font-size:18px}
/* app */
.app{min-height:100vh}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px;padding:0 24px;background:var(--card);border-bottom:1px solid var(--border)}
.topbar .l{display:flex;align-items:center;gap:16px}.topbar svg.lg{height:24px;width:auto}
.tag{font-size:11px;font-weight:700;color:var(--accent);background:var(--navy-50);padding:4px 8px;border-radius:6px}
.wsbtn{display:flex;align-items:center;gap:8px;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);font-size:13px;font-weight:700;color:var(--text-strong);cursor:pointer}
.user{position:relative}
.user>button{display:flex;align-items:center;gap:10px;border:0;background:none;cursor:pointer}
.user .ini{width:36px;height:36px;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:230px;padding:6px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 40px -16px rgba(0,26,86,.3);z-index:20}
.menu button{display:flex;width:100%;align-items:center;gap:10px;height:38px;padding:0 10px;border:0;border-radius:8px;background:none;font-size:13px;font-weight:600;color:var(--text-body);cursor:pointer;text-align:left}
.menu button:hover{background:var(--subtle)}.menu hr{border:0;border-top:1px solid var(--border);margin:6px 4px}.menu .lbl{padding:6px 10px 2px;font-size:11px;font-weight:700;color:var(--text-faint);text-transform:uppercase;letter-spacing:.05em}
main.wrap{max-width:1120px;margin:0 auto;padding:28px 24px 48px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.head h1{margin:0;font-size:26px;letter-spacing:-.02em;color:var(--text-strong)}.head p{margin:4px 0 0;font-size:14px;color:var(--text-muted)}
.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:20px}
.metric{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.metric span{font-size:12px;font-weight:600;color:var(--text-muted)}.metric b{display:block;margin-top:6px;font-size:24px;color:var(--text-strong);letter-spacing:-.02em}
.metric small{display:block;margin-top:2px;font-size:12px;color:var(--text-faint)}
.tablecard{background:var(--card);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border)}
.tabs button{height:46px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:none;font-size:14px;font-weight:600;color:var(--text-muted);cursor:pointer;display:flex;align-items:center;gap:6px}
.tabs button.on{color:var(--text-strong);font-weight:700;border-bottom-color:var(--accent)}
.tabs .n{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--subtle);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.tr{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 120px 150px minmax(0,1.3fr);gap:16px;align-items:center;padding:14px 18px;border-top:1px solid var(--subtle);font-size:13px}
.tr.h{border-top:0;height:40px;padding-top:0;padding-bottom:0;font-size:12px;font-weight:600;color:var(--text-muted)}
.tr b{color:var(--text-strong);font-weight:700}.tr .m{color:var(--text-muted);font-size:12px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 24px}
.empty .icon{margin:0}
.empty h3{margin:0;font-size:17px;color:var(--text-strong)}.empty p{margin:0;max-width:420px;font-size:14px;line-height:1.6;color:var(--text-muted)}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,#EEF0F3,#F6F7F9,#EEF0F3);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}
.modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(16,18,24,.45)}
.modal .card{width:100%;max-width:540px;max-height:calc(100vh - 32px);overflow:auto}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--text-body);margin:4px 0 16px;cursor:pointer}
.consent input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;padding:12px 16px;border-radius:12px;background:var(--accent);color:#fff;font-size:13px;font-weight:700;box-shadow:0 18px 40px -16px rgba(0,26,86,.5)}
.note{margin-top:28px;padding:14px 16px;border:1px dashed #C9CDD3;border-radius:12px;font-size:12px;line-height:1.6;color:var(--text-muted);background:#FBFCFD}
.note b{color:var(--text-body)}
@media (max-width:900px){.auth{grid-template-columns:1fr}.brand{min-height:auto;gap:28px}.metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.feat{grid-template-columns:1fr}.tr{grid-template-columns:minmax(0,1fr) auto}.tr>:nth-child(2),.tr>:nth-child(3),.tr>:nth-child(5){display:none}}
</style>
</head>

  function topbar() {
    const a = S.acc, w = WORKSPACES[S.wsPick] || { name: '' };
    return `<header class="topbar"><div class="l"><svg class="lg" viewBox="0 0 153 47">${LOGO.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}</svg><span class="tag">Partner Portal</span>${a.ws.length > 1 ? `<button class="wsbtn" data-act="switch" title="Switch workspace">${esc(w.name)} ▾</button>` : `<span style="font-size:13px;font-weight:700;color:var(--text-strong)">${esc(w.name)}</span>`}</div>
      <div class="user"><button data-act="menu" aria-haspopup="menu" aria-expanded="${S.menu}"><span style="text-align:right"><b style="display:block;font-size:13px;color:var(--text-strong)">${esc(a.name)}</b><span style="font-size:12px;color:var(--text-muted)">${esc(a.org)}</span></span><span class="ini">${ini(a.name)}</span></button>
      ${S.menu ? `<div class="menu" role="menu">${a.ws.length > 1 ? '<button role="menuitem" data-act="switch">Switch workspace</button>' : ''}<button role="menuitem" data-act="signout">Sign out</button><hr><div class="lbl">Prototype tools</div><button role="menuitem" data-act="simfail">Simulate a loading error</button><button role="menuitem" data-act="simexpire">Simulate session expiry</button><button role="menuitem" data-act="reset">Reset onboarding for this account</button></div>` : ''}</div></header>`;
  }
  function modal() {
    const f = S.modal, E = f.err || {};
    const fld = (id, label, attrs, err) => `<div class="field"><label for="${id}">${label}</label><div class="ctl ${err ? 'err' : ''}"><input id="${id}" ${attrs}></div>${err ? `<span class="msg">${esc(err)}</span>` : ''}</div>`;
    return `<div class="modal" role="dialog" aria-modal="true" aria-label="Submit a referral"><form class="card" id="ref" novalidate><h2>Submit a referral</h2><p style="margin-bottom:18px">${esc(S.data.ws.broker)} at ${esc(S.data.ws.name)} will be notified and contact your client.</p>
      ${fld('rn', 'Client name *', `value="${esc(f.name)}" placeholder="Full name"`, E.name)}
      <div class="grid2">${fld('re', 'Email', `type="email" value="${esc(f.email)}" placeholder="client@email.com"`, E.email)}${fld('rp', 'Phone *', `type="tel" value="${esc(f.phone)}" placeholder="0412 345 678"`, E.phone)}</div>
      <div class="field"><label for="rs">What do they need? *</label><div class="ctl ${E.service ? 'err' : ''}"><select id="rs"><option value="">Choose a service</option>${['Home loan', 'Refinance', 'Investment property', 'Construction loan', 'First home buyer', 'Commercial lending', 'Other'].map(o => `<option ${f.service === o ? 'selected' : ''}>${o}</option>`).join('')}</select></div>${E.service ? `<span class="msg">${esc(E.service)}</span>` : ''}</div>
      <div class="field"><label for="rnote">Notes for the broker</label><textarea id="rnote" class="ta" placeholder="Timing, budget, anything that helps">${esc(f.note)}</textarea></div>
      <label class="consent"><input type="checkbox" id="rc" ${f.consent ? 'checked' : ''}><span>My client has agreed to be contacted by ${esc(S.data.ws.name)} about this enquiry.</span></label>${E.consent ? `<p class="msg" style="margin:-8px 0 12px">${esc(E.consent)}</p>` : ''}
      ${E.form ? alertBox({ kind: 'bad', title: 'Couldn’t submit the referral', text: E.form }) : ''}
      <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" data-act="closeModal">Cancel</button><button class="btn" ${f.busy ? 'disabled' : ''}>${f.busy ? 'Submitting…' : 'Submit referral'}</button></div></form></div>`;
  }
  function render() { $('#app').innerHTML = V[S.view]() + (S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ''); bind(); }

  // ---------------- events ----------------
  function bind() {
    document.querySelectorAll('[data-fill]').forEach(b => b.onclick = () => { $('#em').value = b.dataset.fill; $('#pw').value = PASSWORD; S.email = b.dataset.fill; });
    const f = $('#f'); if (f) f.onsubmit = e => { e.preventDefault(); signIn(); };
    const otp = $('#otp'); if (otp) { const ins = [...otp.querySelectorAll('input')]; ins[0].focus(); ins.forEach((inp, i) => { inp.oninput = () => { inp.value = inp.value.replace(/\D/g, '').slice(0, 1); if (inp.value && ins[i + 1]) ins[i + 1].focus(); }; inp.onkeydown = e => { if (e.key === 'Backspace' && !inp.value && ins[i - 1]) ins[i - 1].focus(); }; inp.onpaste = e => { const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (t.length) { e.preventDefault(); t.split('').forEach((c, k) => { if (ins[k]) ins[k].value = c; }); } }; });
      otp.onsubmit = e => { e.preventDefault(); const code = ins.map(x => x.value).join(''); if (code.length < 6) { S.alert = { kind: 'bad', title: 'Enter all 6 digits', text: '' }; return render(); } if (code !== '123456') { S.alert = { kind: 'bad', title: 'That code isn’t right', text: ' Check the latest email or resend a new code.' }; return render(); } setPref(S.acc.email, { verified: true }); S.alert = null; route({ ...S.acc, verified: true }); }; }
    const su = $('#setup'); if (su) su.onsubmit = e => { e.preventDefault(); const org = $('#org') ? $('#org').value.trim() : S.acc.org, role = $('#role') ? $('#role').value : S.acc.role; S.f = { org, role }; S.err = {}; if (!org) S.err.org = 'Enter your organisation'; if (!role) S.err.role = 'Choose your role'; if (Object.keys(S.err).length) return render(); setPref(S.acc.email, { profile: { org, role } }); S.err = {}; toast('Account details saved'); route({ ...S.acc, org, role }); };
    document.querySelectorAll('[data-ws]').forEach(b => b.onclick = () => { S.wsPick = b.dataset.ws; S.err = {}; render(); });
    document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { if (!alive()) return; S.tab = b.dataset.tab; render(); });
    const rf = $('#ref'); if (rf) rf.onsubmit = e => { e.preventDefault(); submit(); };
    document.querySelectorAll('[data-act]').forEach(b => b.onclick = e => act(b.dataset.act, e));
  }
  function signIn() {
    const em = $('#em').value.trim().toLowerCase(), pw = $('#pw').value; S.email = em; S.err = {}; S.alert = null;
    if (S.lockUntil > now()) return;
    if (!em) S.err.email = 'Enter your email address'; else if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) S.err.email = 'Enter a valid email address';
    if (!pw) S.err.pw = 'Enter your password';
    if (Object.keys(S.err).length) return render();
    const acc = account(em);
    if (!acc || pw !== PASSWORD) { const n = (S.attempts[em] || 0) + 1; S.attempts[em] = n;
      if (n >= 5) { S.lockUntil = now() + 30e3; S.attempts[em] = 0; S.alert = { kind: 'bad', title: 'Too many attempts', text: ' For your security, sign-in is paused for 30 seconds. You can reset your password if you’ve forgotten it.' }; setTimeout(render, 30e3); }
      else S.alert = { kind: 'bad', title: 'Email or password is incorrect', text: ' Check both and try again' + (n >= 3 ? ' — ' + (5 - n) + ' attempts left before a short pause.' : '.') };
      return render(); }
    S.attempts[em] = 0; route(acc);
  }
  function submit() {
    if (!alive()) return;
    const f = S.modal; f.name = $('#rn').value.trim(); f.email = $('#re').value.trim(); f.phone = $('#rp').value.trim(); f.service = $('#rs').value; f.note = $('#rnote').value.trim(); f.consent = $('#rc').checked;
    const E = {}; if (!f.name) E.name = 'Enter the client’s name'; if (!f.phone) E.phone = 'Enter a phone number'; else if (f.phone.replace(/\D/g, '').length < 8) E.phone = 'Enter a valid phone number';
    if (f.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.email)) E.email = 'Enter a valid email address'; if (!f.service) E.service = 'Choose what they need'; if (!f.consent) E.consent = 'Confirm your client agreed to be contacted';
    f.err = E; if (Object.keys(E).length) return render();
    if (S.data.ws.source !== 'crm') { f.err = { form: 'This demo workspace isn’t connected to a CRM. Switch to Harbour Home Loans to try submitting.' }; return render(); }
    f.busy = true; render();
    setTimeout(() => submitReferral(S.acc, f).then(() => { S.modal = null; toast('Referral sent to ' + S.data.ws.broker); loadWorkspace(S.acc, S.wsPick).then(data => { S.data = data; S.tab = 'received'; render(); }); })
      .catch(() => { f.busy = false; f.err = { form: 'Open the Finaze CRM in this browser once so the demo data exists, then try again.' }; render(); }), 500);
  }
  function act(a) {
    const A = {
      eye: () => { const p = $('#pw'); p.type = p.type === 'password' ? 'text' : 'password'; },
      forgot: () => { S.alert = { kind: 'info', title: 'Password reset', text: ' We’ll email a reset link to your address. (Needs backend — not available in this prototype.)' }; render(); },
      signout: () => { sess.clear(); go('signin', { acc: null, menu: false, data: null, alert: { kind: 'good', title: 'You’ve signed out', text: '' } }); },
      toSignin: () => go('signin', { alert: null }),
      resend: () => { S.alert = { kind: 'good', title: 'New code sent', text: ' Check your inbox (demo code is still 123456).' }; render(); },
      pickws: () => { if (!S.wsPick) { S.err = { ws: 'Choose a workspace to continue' }; return render(); } S.err = {}; if (!S.acc.onboarded) return go('welcome'); open(S.wsPick); },
      enter: () => { setPref(S.acc.email, { onboarded: true }); S.acc.onboarded = true; open(S.wsPick); },
      retry: () => open(S.wsPick),
      switch: () => { S.menu = false; go('workspace'); },
      menu: () => { S.menu = !S.menu; render(); },
      new: () => { if (!alive()) return; if (!S.acc.perms.includes('submit')) { toast('Your access is view-only'); return; } S.modal = { name: '', email: '', phone: '', service: '', note: '', consent: false, err: {} }; render(); },
      closeModal: () => { S.modal = null; render(); },
      simfail: () => { S.menu = false; S.failNext = true; open(S.wsPick); },
      simexpire: () => { S.menu = false; const x = sess.get(); if (x) { x.exp = now() - 1; sess.set(x); } toast('Session expired — your next action will ask you to sign in'); },
      reset: () => { S.menu = false; setPref(S.acc.email, { onboarded: false, lastWs: '', verified: null, profile: null }); toast('Onboarding reset — sign out and back in to see it again'); }
    }; (A[a] || (() => {}))();
  }
  document.addEventListener('click', e => { if (S.menu && !e.target.closest('.user')) { S.menu = false; render(); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.modal) { S.modal = null; render(); } });

  // returning visit in the same tab: resume the session if it's still valid
  const x = sess.get(); if (x && x.exp > now() && account(x.email)) { S.acc = account(x.email); open(x.ws); } else { if (x) { sess.clear(); S.view = 'expired'; } render(); }
})();
</script>
</body>
